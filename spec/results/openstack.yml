  admin_username: admin
  bosh: proto-main
  bosh-deployment-date: 2025-Oct-24 16:51:47 UTC
  bosh-deployment-url: https://github.com/cloudfoundry/bosh-deployment/tree/1567636f526d89cb4c39ea59c88b4fb97a48ac69
