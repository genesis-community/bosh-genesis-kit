---
# Opt-in PVE multi-storage placement, selected via the `pve-storage-sets`
# feature. Loaded AFTER overlay/cpis/pve-base.yml (blueprint.pm processes the
# IaaS baseline files before the feature loop), so the director's own pve
# property block already exists and these replace? paths land inside it.
#
# Every op targets /instance_groups/name=bosh/properties/pve only. There is
# deliberately no cloud_provider counterpart, unlike pve-ha-proto.yml. The CPI
# refuses a set-managed placement until it can lock
# storage_allocation_journal_dir, and during `bosh create-env` the CPI runs on
# the operator's workstation or the bastion, where /var/vcap/store does not
# exist and nothing provisions it. The director VM keeps scalar placement for
# its own root and persistent disks, and storage sets take over for every VM
# the director goes on to create.
#
# The three optional CPI keys this feature does not model -- root_storage_set,
# require_disjoint_storage_sets, and storage_status_max_age_seconds -- are set
# through bosh-configs.director-cpi when an env ever needs them. See MANUAL.md.

# The director runs its CPI calls inside BPM worker processes, and BPM gives
# each job only its own store directory, so the journal directory is invisible
# to the CPI until the director job mounts it. director.cpi_additional_volumes
# is appended to every worker's unrestricted_volumes by the bosh release's
# jobs/director/templates/bpm.yml, alongside the CPI job and log directories it
# derives from director.cpi_job. writable: true because the CPI locks and
# writes the journal, and mount_only: true because the pve_cpi job's own
# pre-start already creates the directory as vcap with mode 0700 and BPM must
# not create it first with different ownership.
#
# This is the only place the kit sets cpi_additional_volumes, so the list is
# written whole rather than appended to. It reuses the same journal-dir
# variable the properties below use, so the mount and the property cannot drift
# apart.
- type: replace
  path: /instance_groups/name=bosh/properties/director/cpi_additional_volumes?
  value:
  - path: ((pve_storage_allocation_journal_dir))
    writable: true
    mount_only: true

# Named groups of shared NFS storages. A map, passed through whole.
- type: replace
  path: /instance_groups/name=bosh/properties/pve/storage_sets?
  value: ((pve_storage_sets))

# Role bindings. An empty string leaves that role on its scalar pool
# (pve.vm_storage for root and ephemeral, pve.disk_storage for persistent),
# which is what every release before CPI 0.6.0 did.
- type: replace
  path: /instance_groups/name=bosh/properties/pve/ephemeral_storage_set?
  value: ((pve_ephemeral_storage_set))

- type: replace
  path: /instance_groups/name=bosh/properties/pve/persistent_storage_set?
  value: ((pve_persistent_storage_set))

# Shared capacity budgets, keyed by domain name. An empty map is valid and
# means no storage shares a budget with any other.
- type: replace
  path: /instance_groups/name=bosh/properties/pve/storage_capacity_domains?
  value: ((pve_storage_capacity_domains))

# The allocation authority and the journal it locks. Both are required before
# the CPI will run a set-managed placement, and the job's pre-start provisions
# the journal directory on the director's persistent disk.
- type: replace
  path: /instance_groups/name=bosh/properties/pve/storage_placement_namespace?
  value: ((pve_storage_placement_namespace))

- type: replace
  path: /instance_groups/name=bosh/properties/pve/storage_allocation_journal_dir?
  value: ((pve_storage_allocation_journal_dir))
