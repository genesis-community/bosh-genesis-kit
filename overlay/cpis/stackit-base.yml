- name: cpi
  path: /releases/-
  type: replace
  value:
    name: bosh-stackit-cpi
    sha1: 4fcc8a65086c098c4fa151c0d5a51d6a94da33c3
    url: https://object.storage.eu01.onstackit.cloud/scf-cpi-prod/bosh-stackit-cpi-v0.1.0-dev-9c215d8.tgz
    version: "0+dev.30"
- name: stemcell
  path: /resource_pools/name=vms/stemcell?
  type: replace
  value:
    sha1: f49d3dd24cfe29dc9fe53115b456a51ea2ef6be4
    url: https://storage.googleapis.com/bosh-core-stemcells/1.829/bosh-stemcell-1.829-openstack-kvm-ubuntu-jammy-go_agent.tgz
- path: /resource_pools/name=vms/cloud_properties?
  type: replace
  value:
    availability_zone: ((az))
    instance_type: g1.3
- path: /networks/name=default/subnets/0/cloud_properties?
  type: replace
  value:
    net_id: ((net_id))
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: stackit_cpi
    release: bosh-stackit-cpi
- path: /instance_groups/name=bosh/properties/director/cpi_job?
  type: replace
  value: stackit_cpi
- path: /cloud_provider/template?
  type: replace
  value:
    name: stackit_cpi
    release: bosh-stackit-cpi
- path: /instance_groups/name=bosh/properties/stackit?
  type: replace
  value:
    project_id:              ((stackit_project_id))
    region:                  ((stackit_region))
    auth_token:              ""
    service_account_json:    ((stackit_service_account_json))
    default_key_name:        ((default_key_name))
    default_security_groups: ((default_security_groups))
    human_readable_vm_names: true
- path: /cloud_provider/properties/stackit?
  type: replace
  value:
    project_id:              ((stackit_project_id))
    region:                  ((stackit_region))
    auth_token:              ""
    service_account_json:    ((stackit_service_account_json))
    default_key_name:        ((default_key_name))
    default_security_groups: ((default_security_groups))
    human_readable_vm_names: true
- path: /instance_groups/name=bosh/properties/stackit/org_id?
  type: replace
  value: ((stackit_org_id))
- path: /cloud_provider/properties/stackit/org_id?
  type: replace
  value: ((stackit_org_id))
