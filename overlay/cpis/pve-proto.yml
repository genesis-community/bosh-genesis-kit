---
# PVE proto (create-env) overlay — mgmt-BOSH only.
# Sourced by blueprint.pm as overlay/cpis/pve-proto.yml when is_create_env is true.
# Mirrors openstack-proto.yml / stackit-proto.yml pattern.
#
# Provides resource_pools + disk_pools sizing for the director VM itself,
# sourced from bosh-variables written by ocfp/pve/mgmt.yml (or pve.yml for
# non-OCFP environments).  Also supplies network placement for the director.

params:
  pve_director_cpu:         2
  pve_director_memory:      4096
  pve_director_disk:        32768
  internal_cidr:            (( param "What CIDR is the director network (e.g. 10.64.64.0/18)?" ))
  internal_gw:              (( param "What is the director network gateway?" ))
  internal_ip:              (( param "What static IP does the BOSH director get?" ))
  stemcell_url:             (( param "What URL is the openstack-kvm stemcell?" ))
  stemcell_sha1:            (( param "What sha1 does the stemcell have?" ))
  # raw required on block backends (lvmthin/zfspool); qcow2 valid only on
  # file-based storages (dir/nfs/cifs). Only meaningful here: pve-base.yml's
  # disk_pools entry is removed by overlay/no-proto.yml on the
  # director-deployed path, so this has nothing to affect there.
  pve_disk_format:          raw

# pve_cpi_release_{url,version,sha1} default in overlay/cpis/pve.yml, since
# pve-base.yml's releases entry needs them on both the create-env and
# director-deployed paths, not just here.
bosh-variables:
  internal_cidr:            (( grab params.internal_cidr ))
  internal_gw:              (( grab params.internal_gw ))
  internal_ip:              (( grab params.internal_ip ))
  stemcell_url:             (( grab params.stemcell_url ))
  stemcell_sha1:            (( grab params.stemcell_sha1 ))
  pve_disk_format:          (( grab params.pve_disk_format ))
  # Operator-side host (Tailscale FQDN or similar) used by cloud_provider,
  # which only exists on the create-env path. Defaults to pve_host so
  # single-network setups need no override.
  pve_host_operator:        (( grab params.pve_host_operator || params.pve_host ))

# resource_pools cloud_properties are overridden here for the director VM.
# The pve-base.yml ops file sets the path; this proto file supplies the values.
# Inlined so genesis merges correctly with the base resource_pool entry.
resource_pools:
- cloud_properties:
    cpu:    (( grab params.pve_director_cpu ))
    memory: (( grab params.pve_director_memory ))
    disk:   (( grab params.pve_director_disk ))
