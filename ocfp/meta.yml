---
meta:
  default_persistent_disk_size_in_mb: 65536 # referenced in overlay/base-proto.yml
  ocfp:
    env:
      az:     (( grab params.availability_zones[0] || "z1" ))
      subnet: (( grab params.ocfp_subnet || "ocfp-0" ))

    vault:
      config:        (( grab genesis.ocfp_config_base ))

    # certs/org.ca and the blacksmith ca in blacksmith exodus will be added automagically
    # if they exist in the vault, and certs/dbs:ca will be added if external dbs are used
    certs:
      trusted: []

    bosh:
      ip:        (( vault meta.ocfp.vault.config "/net/subnets/" meta.ocfp.env.subnet "/reserved-ips:bosh_ip" )) # Shouldn't this just be ocfp-0:ip ???  instead of /bosh/net/bosh:ip
      gateway:   (( vault meta.ocfp.vault.config "/net/subnets/" meta.ocfp.env.subnet ":gateway" )) # Shouldn't this just be ocfp-0:gateway ??? instead of /bosh/net/bosh:gateway
      cidr:      (( vault meta.ocfp.vault.config "/net/subnets/" meta.ocfp.env.subnet ":cidr_block" ))
      subnet_id: (( vault meta.ocfp.vault.config "/net/subnets/" meta.ocfp.env.subnet ":id" ))
      region:    (( vault meta.ocfp.vault.config "/net:region" ))

      dns:
        - (( vault meta.ocfp.vault.config "/net:dns" ))

      # s3.bucket_name/region moved to ocfp/meta-blobstore.yml (blueprint.pm
      # adds it only for the aws/google branches that actually consume it,
      # gated the same as those branches' other +internal-blobstore-opt-out
      # files). PVE/openstack/stackit fully replace this meta.ocfp.bosh.s3
      # block from their own IaaS-specific compatible-blobstore.yml, so this
      # file no longer eagerly grabs /bosh/blobstores/bosh:name|:region for
      # every env — previously that grab was unconditional here and errored
      # for PVE's default internal-blobstore case, which has no S3 blobstore
      # at all.

      disk_encryption: true # Default to encrypted at rest
