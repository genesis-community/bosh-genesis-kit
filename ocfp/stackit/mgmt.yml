---
meta:
  ocfp:
    bosh:
      mbus: # TODO: Bosh >274 mbus will change
        password: (( vault meta.vault "/mbus_bootstrap:password" ))
        ssl:
          ca:   (( vault meta.vault "/ssl/ca:certificate" ))
          cert: (( vault meta.vault "/ssl/mbus:certificate" ))
          key:  (( vault meta.vault "/ssl/mbus:key" ))

params:
  stackit_flavor:          (( grab meta.ocfp.cpi.instance_type || "m1.2" ))
  disk_size_in_gb:         128

bosh-variables:
  mbus_bootstrap_password: (( grab meta.ocfp.bosh.mbus.password ))
  mbus_bootstrap_ssl:
    ca:          (( grab meta.ocfp.bosh.mbus.ssl.ca ))
    certificate: (( grab meta.ocfp.bosh.mbus.ssl.cert ))
    private_key: (( grab meta.ocfp.bosh.mbus.ssl.key ))

networks:
- name: default
  subnets:
  - (( inline ))
  - cloud_properties:
      security_groups: (( grab params.stackit_default_sgs ))

#instance_groups:
#- name: bosh
#  properties:
#    stackit:
#      boot_from_volume: true
#      default_volume_type: (( grab meta.ocfp.cpi.default_volume_type ))
#      root_disk:
#        size: (( grab meta.ocfp.cpi.root_disk_size ))

resource_pools:
- cloud_properties:
    instance_type: (( grab params.stackit_flavor ))
    boot_from_volume: true
    default_volume_type: (( grab meta.ocfp.cpi.default_volume_type ))
    root_disk:
      size: (( grab meta.ocfp.cpi.root_disk_size ))

disk_pools:
- name: disks
  disk_size: (( grab params.disk_size_in_gb)) # Convert GB to MB


