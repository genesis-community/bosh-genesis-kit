- name: cpi
  path: /releases/-
  type: replace
  value:
    name: bosh-stackit-cpi
    sha1: 4bf149039d6f7eb1d09307ba39fab4387acce0b7
    url: https://bosh-stackit-cpi-release.s3.us-east-1.amazonaws.com/bosh-stackit-cpi-dev-release-0.0.22.tgz
    version: "0+dev.22"
- name: stemcell
  path: /resource_pools/name=vms/stemcell?
  type: replace
  value:
    sha1: 357b2c20edab31bf5c6d819172c244a9476ffbcc
    url: https://bosh-stackit-cpi-release.s3.us-east-1.amazonaws.com/bosh-stemcell-1.823-openstack-kvm-ubuntu-jammy-go_agent-520.tgz
- path: /resource_pools/name=vms/cloud_properties?
  type: replace
  value:
    availability_zone: ((az))
    instance_type: g1.3
- path: /networks/name=default/subnets/0/cloud_properties?
  type: replace
  value:
    net_id: ((net_id))
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: stackit-cpi
    release: bosh-stackit-cpi
- path: /instance_groups/name=bosh/properties/director/cpi_job?
  type: replace
  value: stackit-cpi
- path: /cloud_provider/template?
  type: replace
  value:
    name: stackit-cpi
    release: bosh-stackit-cpi
- path: /instance_groups/name=bosh/properties/stackit?
  type: replace
  value:
    project_id:              ((stackit_project_id))
    organization_id:         ((stackit_org_id))
    regions_id:              ((stackit_region))
    auth_token:              ""
    service_account_json:    ((stackit_service_account_json))
    default_key_name:        ((default_key_name))
    default_security_groups: ((default_security_groups))
    human_readable_vm_names: true
- path: /cloud_provider/properties/stackit?
  type: replace
  value:
    project_id:              ((stackit_project_id))
    organization_id:         ((stackit_org_id))
    regions_id:              ((stackit_region))
    auth_token:              ""
    service_account_json:    ((stackit_service_account_json))
    default_key_name:        ((default_key_name))
    default_security_groups: ((default_security_groups))
    human_readable_vm_names: true
