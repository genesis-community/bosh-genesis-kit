releases:
- name:    "syslog"
  version: "12.3.9"
  sha1:    "9ba8e91b1895fcf96ebfb9dbcb55c3a35ca3f919"
  url:     "https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.9"

addons:
- name: syslog
  jobs:
  - name: syslog_forwarder
    release: syslog
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
